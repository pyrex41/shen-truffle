name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM 25.2
        uses: graalvm/setup-graalvm@v1.6.4
        with:
          version: '25.2'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Check POSIX launcher
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/shen-truffle
          scripts/shen-truffle --version

      - name: Check Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\shen-truffle.cmd --version

  certify:
    name: Shen 41.2 certification gate
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM 25.2
        uses: graalvm/setup-graalvm@v1.6.4
        with:
          version: '25.2'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Run vendored canonical certification suite
        run: mvn --batch-mode --no-transfer-progress -Pshen verify

  native-image:
    name: Native Image smoke test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM 25.2
        uses: graalvm/setup-graalvm@v1.6.4
        with:
          version: '25.2'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify Native Image toolchain
        shell: bash
        run: |
          java --version
          native-image --version
          native-image --version | grep '25\.2\.'
      - name: Build native distribution
        run: mvn --batch-mode --no-transfer-progress -Pnative package
      - name: Exercise native distribution
        shell: bash
        run: |
          ./target/shen-truffle-native --version
          test "$(./target/shen-truffle-native eval -e '(+ 40 2)')" = 42
